# Pre-commit hooks for hermes-agent (AZ-25, AZ-26)
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # ---------------------------------------------------------------------------
  # Ruff — lint + format (replaces flake8, isort, black) (AZ-26)
  # Auto-fixes safe violations before they hit CI
  # ---------------------------------------------------------------------------
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.10
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # ---------------------------------------------------------------------------
  # detect-secrets — prevent credential commits (AZ-12)
  # Run `detect-secrets scan > .secrets.baseline` to initialize
  # ---------------------------------------------------------------------------
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: package-lock.json

  # ---------------------------------------------------------------------------
  # General file hygiene
  # ---------------------------------------------------------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: debug-statements   # catch leftover breakpoint()/pdb.set_trace()
      - id: check-json
      - id: mixed-line-ending
        args: [--fix=lf]
