name: Tests

on:
  push:
    branches: [rosenblatt/main]
  pull_request:
    branches: [rosenblatt/main]

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint job — Ruff + mypy + interrogate + vulture (AZ-8, AZ-9, AZ-10, AZ-11)
  # All steps are non-blocking (continue-on-error: true) initially.
  # They run, emit annotations, and upload machine-readable artifacts for the
  # upcoming Hermes AI review agent (AZ-4).  Gates will be made blocking once
  # a clean baseline is established for each tool.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dev dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      # Ruff lint — GitHub-format annotations + JSON artifact for AI review agent
      # Non-blocking until pre-existing violations are cleaned up (AZ-8)
      - name: Ruff — lint (AZ-8)
        if: always()
        run: |
          source .venv/bin/activate
          ruff check . --output-format=github 2>&1 || true
          ruff check . --output-format=json > ruff-report.json 2>&1 || true

      - name: Upload ruff report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.2
        with:
          name: ruff-report
          path: ruff-report.json

      # Ruff format check — non-blocking until codebase is formatted (AZ-8)
      - name: Ruff — format check (AZ-8)
        if: always()
        run: |
          source .venv/bin/activate
          ruff format --check . 2>&1 || true
        continue-on-error: true

      # mypy — non-blocking until type baseline is established (AZ-9)
      - name: mypy — type check (AZ-9)
        if: always()
        run: |
          source .venv/bin/activate
          mypy . --ignore-missing-imports --no-error-summary 2>&1 | tee mypy-report.txt || true
        continue-on-error: true

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.2
        with:
          name: mypy-report
          path: mypy-report.txt

      # interrogate — non-blocking until docstring baseline is established (AZ-18)
      - name: interrogate — docstring coverage (AZ-18)
        if: always()
        run: |
          source .venv/bin/activate
          interrogate -vv --fail-under 60 . \
            --ignore-init-method --ignore-init-module \
            --ignore-magic --ignore-semiprivate --ignore-private \
            --ignore-module --ignore-nested-functions \
            --exclude tests --exclude environments --exclude .venv 2>&1 || true
        continue-on-error: true

      # vulture — non-blocking initially (AZ-11)
      - name: vulture — dead code (AZ-11)
        if: always()
        run: |
          source .venv/bin/activate
          vulture . vulture_whitelist.py --min-confidence 80 2>&1 | tee vulture-report.txt || true
        continue-on-error: true

      - name: Upload vulture report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.2
        with:
          name: vulture-report
          path: vulture-report.txt

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/e2e --tb=short -n auto
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

      # Coverage measurement — non-blocking initially (AZ-16)
      # Gate will be enforced once coverage reaches the 50% threshold.
      - name: Run tests with coverage (AZ-16)
        if: always()
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/e2e \
            --tb=no -n auto \
            --cov=. --cov-report=json --cov-report=term-missing \
            --cov-config=pyproject.toml 2>&1 | tail -20 || true
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
        continue-on-error: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.2
        with:
          name: coverage-report
          path: coverage.json

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
