name: Tests

on:
  push:
    branches: [rosenblatt/main]
  pull_request:
    branches: [rosenblatt/main]

permissions:
  contents: read

# Cancel in-progress runs for the same PR/branch
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Lint job — Ruff + mypy + interrogate + vulture (AZ-8, AZ-9, AZ-10, AZ-11)
  # Runs first (fast, <2min) to give quick feedback before the full test suite
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dev dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Ruff — lint (AZ-8)
        run: |
          source .venv/bin/activate
          ruff check . --output-format=github
        # Use --output-format=github for PR annotations; also emit JSON artifact
      - name: Ruff — lint (JSON artifact)
        if: always()
        run: |
          source .venv/bin/activate
          ruff check . --output-format=json > ruff-report.json 2>/dev/null || true
      - name: Upload ruff report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ruff-report
          path: ruff-report.json

      - name: Ruff — format check (AZ-8)
        run: |
          source .venv/bin/activate
          ruff format --check .

      - name: mypy — type check (AZ-9)
        run: |
          source .venv/bin/activate
          mypy . --ignore-missing-imports --no-error-summary 2>&1 | tee mypy-report.txt || true
          # Fail only on errors (exit 1), not on missing stubs (exit 2)
          mypy . --ignore-missing-imports --no-error-summary
        continue-on-error: true  # Non-blocking until type baseline is established

      - name: Upload mypy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mypy-report
          path: mypy-report.txt

      - name: interrogate — docstring coverage (AZ-18)
        run: |
          source .venv/bin/activate
          interrogate -vv --fail-under 60 . --ignore-init-method --ignore-init-module \
            --ignore-magic --ignore-semiprivate --ignore-private --ignore-module \
            --ignore-nested-functions --exclude tests --exclude environments --exclude .venv
        continue-on-error: true  # Non-blocking until docstring baseline is established

      - name: vulture — dead code (AZ-11)
        run: |
          source .venv/bin/activate
          vulture . --min-confidence 80 > vulture-report.txt 2>&1 || true
          cat vulture-report.txt
        continue-on-error: true  # Non-blocking initially; convert to blocking after first clean pass

      - name: Upload vulture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulture-report
          path: vulture-report.txt

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/ -q --ignore=tests/integration --ignore=tests/e2e --tb=short -n auto
        env:
          # Ensure tests don't accidentally call real APIs
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Set up Python 3.11
        run: uv python install 3.11

      - name: Install dependencies
        run: |
          uv venv .venv --python 3.11
          source .venv/bin/activate
          uv pip install -e ".[all,dev]"

      - name: Run e2e tests
        run: |
          source .venv/bin/activate
          python -m pytest tests/e2e/ -v --tb=short
        env:
          OPENROUTER_API_KEY: ""
          OPENAI_API_KEY: ""
          NOUS_API_KEY: ""
